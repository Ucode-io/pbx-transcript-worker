# One-shot benchmark Job, pinned to worker08 (the only node with real headroom).
# Runs the image in `bench` mode and exits; read the timing from its logs:
#   kubectl -n ucode-prod logs job/rubaistt-bench
#
# Runs in ucode-prod: that's where ghcr.io/ucode-io workloads live and the
# `ghcr-registry` pull secret exists (knative-fn only has gitlab creds).
apiVersion: batch/v1
kind: Job
metadata:
  name: rubaistt-bench
  namespace: ucode-prod
spec:
  backoffLimit: 0            # don't retry — a failure is a result we want to read
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: rubaistt-bench
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-registry
      nodeSelector:
        kubernetes.io/hostname: worker08   # fallback: worker03
      containers:
        - name: bench
          image: ghcr.io/ucode-io/pbx-transcript-worker:latest
          imagePullPolicy: Always
          args: ["bench"]    # override the image's default "worker" mode
          env:
            - name: THREADS
              value: "4"     # matches the eventual worker's 4-CPU limit
          resources:
            requests:
              cpu: "2"          # worker08 has only ~2.6 cores free by request
              memory: "3Gi"
            limits:
              cpu: "4"          # burst to 4 at runtime (node is ~89% idle) so THREADS=4 is real
              memory: "3Gi"
